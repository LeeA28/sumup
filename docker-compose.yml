# Local Postgres for development. Start it with: docker compose up -d
services:
  db:
    image: postgres:18                    # same major version as Railway's database
    environment:
      POSTGRES_USER: sumup
      POSTGRES_PASSWORD: sumup_dev        # local-only password, never used in production
      POSTGRES_DB: sumup
    ports:
      - "127.0.0.1:5432:5432"             # reachable from this PC only
    volumes:
      # Postgres 18 images keep data in a version-named folder under /var/lib/postgresql
      # (instead of /var/lib/postgresql/data), so the volume mounts one level higher
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
